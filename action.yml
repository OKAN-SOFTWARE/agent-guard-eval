name: "AgentGuard Evaluation & Security Scanner"
description: "Deterministic security, guardrail & reliability evaluation for AI agent traces with SARIF and Step Summary integration"
author: "Veer Jain"

branding:
  icon: "shield"
  color: "blue"

inputs:
  trace-file:
    description: "Path to the AgentTrace JSON file to evaluate."
    required: true
  schema-file:
    description: "Optional path to the tool JSON schemas file."
    required: false
    default: ""
  fail-on:
    description: "Severity threshold to fail the workflow (ANY, MEDIUM, HIGH, CRITICAL)."
    required: false
    default: "ANY"
  format:
    description: "Output report format (console, sarif, junit, html)."
    required: false
    default: "console"
  output-file:
    description: "Optional path to save the generated report."
    required: false
    default: ""

outputs:
  passed:
    description: "Whether the trace passed all evaluation checks ('true' or 'false')."
    value: ${{ steps.run-eval.outputs.passed }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install AgentGuard
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Execute AgentGuard Evaluation
      id: run-eval
      shell: bash
      run: |
        CMD="agentguard evaluate '${{ inputs.trace-file }}' --format '${{ inputs.format }}' --fail-on '${{ inputs.fail-on }}'"

        if [ -n "${{ inputs.schema-file }}" ]; then
          CMD="$CMD -s '${{ inputs.schema-file }}'"
        fi

        if [ -n "${{ inputs.output-file }}" ]; then
          CMD="$CMD -o '${{ inputs.output-file }}'"
        fi

        echo "Running: $CMD"
        if eval "$CMD"; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
